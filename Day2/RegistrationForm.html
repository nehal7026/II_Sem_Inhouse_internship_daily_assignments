<!DOCTYPE html>
<html>
<head>
    <title>College Admission Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h2>College Admission Form</h2>

<form>

    <label>Full Name</label><br>
    <input type="text" placeholder="Enter your name"><br><br>

    <label>Email</label><br>
    <input type="email" placeholder="Enter your email"><br><br>

    <label>Phone Number</label><br>
    <input type="tel" placeholder="Enter your phone number"><br><br>

    <label>Gender</label><br>
    <input type="radio" name="gender"> Male
    <input type="radio" name="gender"> Female
    <input type="radio" name="gender"> Other
    <br><br>

    <label>Date of Birth</label><br>
    <input type="date"><br><br>

    <label>Department</label><br>
    <select>
        <option>Select Department</option>
        <option>Computer Science</option>
        <option>Information Technology</option>
        <option>Mechanical</option>
        <option>Civil</option>
        <option>Electronics</option>
    </select>
    <br><br>

    <label>Address</label><br>
    <br>
    <label>House No.</label><br>
<input type="text" placeholder="Enter House No."><br><br>

<label>City</label><br>
<input type="text" placeholder="Enter City"><br><br>

<label>Region/State</label><br>
<input type="text" placeholder="Enter Region/State"><br><br>

<label>Country</label><br>
<input type="text" placeholder="Enter Country"><br><br>

<label>Pincode</label><br>
<input type="number" placeholder="Enter Pincode"><br><br>
    <br><br>

    <label>Password</label><br>
    <input type="password" placeholder="Enter password"><br><br>

    <label>Confirm Password</label><br>
    <input type="password" placeholder="Confirm password"><br><br>

    <input type="submit" value="Submit">

</form>

</body>
</html>
